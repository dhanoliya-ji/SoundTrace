[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "soundtrace"
version = "0.2.0"
description = "Research prototype for reliable audio-visual source segmentation"
requires-python = ">=3.11,<3.13"
dependencies = ["torch>=2.2", "torchvision>=0.17", "numpy>=1.26", "PyYAML>=6", "Pillow>=10",
                "opencv-python-headless>=4.9", "imageio-ffmpeg>=0.6",
                "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 145
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731", "B905"]
