[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundtrace"
version = "0.1.0"
description = "Research prototype for reliable audio-visual source segmentation"
requires-python = ">=3.11,<3.13"
dependencies = ["torch>=2.2", "numpy>=1.26", "PyYAML>=6", "Pillow>=10", "opencv-python-headless>=4.9"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
